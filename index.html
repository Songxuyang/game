<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>重力翻转小人 MVP v1.0</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { display: flex; align-items: center; justify-content: center; background: #090e19; touch-action: none; }
canvas { display: block; width: min(100vw, 66.666667vh); height: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 480 / 720; background: #111827; touch-action: none; }
@supports (height: 100dvh) { canvas { width: min(100vw, 66.666667dvh); max-height: 100dvh; } }
</style>
</head>
<body>
<canvas id="game" width="480" height="720" aria-label="重力翻转小人：点击、触摸或按空格开始和翻转重力">你的浏览器不支持 Canvas。</canvas>
<script>
'use strict';
const W = 480, H = 720;
const PLAYER_SIZE = 28, PLAYER_X = 120, PLAYER_INITIAL_Y = 120;
const GRAVITY = 1600, MAX_VY = 650, FLIP_IMPULSE = 200;
const PLATFORM_H = 18, PLATFORM_MIN_W = 140, PLATFORM_MAX_W = 240;
const BASE_SPEED = 140, SPEED_PER_SCORE = 6, MAX_SPEED = 300;
const PLATFORM_MIN_Y = 80, PLATFORM_MAX_Y = H - 80 - PLATFORM_H;
const MAX_VERTICAL_DELTA = 260, MIN_GAP = 180, MAX_GAP = 300;
const COLLISION_TOLERANCE = 8, MAX_DT = 0.033;
const BEST_KEY = 'gravity_flip_best';
const READY = 'READY', PLAYING = 'PLAYING', GAME_OVER = 'GAME_OVER';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let state = READY, player, platforms, standingPlatform;
let gravityDir = 1, score = 0, best = 0, nextGap = 0;
let lastTime = null, lastTouchTime = -Infinity;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const random = (min, max) => min + Math.random() * (max - min);
try {
  const saved = Number(localStorage.getItem(BEST_KEY));
  if (Number.isSafeInteger(saved) && saved >= 0) best = saved;
} catch (_) { /* 存储不可用时仍可正常游戏。 */ }

function updateBest() {
  if (score <= best) return;
  best = score;
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
}

function resetGame() {
  player = { x: PLAYER_X, y: PLAYER_INITIAL_Y, vy: 0 };
  gravityDir = 1;
  standingPlatform = null;
  score = 0;
  platforms = [{ x: 80, y: 420, w: 220, h: PLATFORM_H, scored: false }];
  nextGap = random(MIN_GAP, MAX_GAP);
  lastTime = null;
  state = PLAYING;
}

function spawnPlatform() {
  const previous = platforms[platforms.length - 1];
  const minY = previous ? Math.max(PLATFORM_MIN_Y, previous.y - MAX_VERTICAL_DELTA) : PLATFORM_MIN_Y;
  const maxY = previous ? Math.min(PLATFORM_MAX_Y, previous.y + MAX_VERTICAL_DELTA) : PLATFORM_MAX_Y;
  platforms.push({ x: W + 40, y: random(minY, maxY), w: random(PLATFORM_MIN_W, PLATFORM_MAX_W), h: PLATFORM_H, scored: false });
  nextGap = random(MIN_GAP, MAX_GAP);
}

function handleFlip() {
  if (state !== PLAYING) { resetGame(); return; }
  standingPlatform = null;
  gravityDir *= -1;
  player.vy = gravityDir * FLIP_IMPULSE;
}

function checkCollision(previousY) {
  let landing = null;
  let firstContact = Infinity;
  for (const platform of platforms) {
    const overlapX = player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w;
    if (!overlapX) continue;
    const overlapY = player.y + PLAYER_SIZE >= platform.y && player.y <= platform.y + platform.h;
    let crossed = false, near = false, contact = Infinity;
    if (gravityDir === 1 && player.vy >= 0) {
      const oldBottom = previousY + PLAYER_SIZE;
      const bottom = player.y + PLAYER_SIZE;
      crossed = oldBottom <= platform.y && bottom >= platform.y;
      near = overlapY && oldBottom <= platform.y + COLLISION_TOLERANCE && Math.abs(bottom - platform.y) <= COLLISION_TOLERANCE;
      contact = (platform.y - oldBottom) / (bottom - oldBottom || 1);
    } else if (gravityDir === -1 && player.vy <= 0) {
      const surface = platform.y + platform.h;
      crossed = previousY >= surface && player.y <= surface;
      near = overlapY && previousY >= surface - COLLISION_TOLERANCE && Math.abs(player.y - surface) <= COLLISION_TOLERANCE;
      contact = (previousY - surface) / (previousY - player.y || 1);
    }
    // 跨面检测补充 AABB，避免高速下落时一帧穿过平台。
    if ((crossed || near) && Math.max(0, contact) < firstContact) {
      firstContact = Math.max(0, contact);
      landing = platform;
    }
  }
  if (!landing) return;
  player.y = gravityDir === 1 ? landing.y - PLAYER_SIZE : landing.y + landing.h;
  player.vy = 0;
  standingPlatform = landing;
  if (!landing.scored) {
    landing.scored = true;
    score += 1;
    updateBest();
  }
}

function gameOver() {
  state = GAME_OVER;
  updateBest();
}

function update(dt) {
  if (state !== PLAYING) return;
  const currentSpeed = Math.min(BASE_SPEED + score * SPEED_PER_SCORE, MAX_SPEED);
  for (const platform of platforms) platform.x -= currentSpeed * dt;
  if (standingPlatform) {
    const platform = standingPlatform;
    if (player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w) {
      player.y = gravityDir === 1 ? platform.y - PLAYER_SIZE : platform.y + platform.h;
      player.vy = 0;
    } else {
      standingPlatform = null;
      player.vy = 0;
    }
  }
  if (!standingPlatform) {
    const previousY = player.y;
    player.vy = clamp(player.vy + gravityDir * GRAVITY * dt, -MAX_VY, MAX_VY);
    player.y += player.vy * dt;
    checkCollision(previousY);
  }
  if (player.y < 0 || player.y + PLAYER_SIZE > H) { gameOver(); return; }
  const latest = platforms[platforms.length - 1];
  if (!latest || latest.x < W - nextGap) spawnPlatform();
  platforms = platforms.filter(platform => platform.x + platform.w >= 0);
}

function draw() {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(0, 0, W, 2);
  ctx.fillRect(0, H - 2, W, 2);
  ctx.fillStyle = '#22c55e';
  for (const platform of platforms) ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = '#f9fafb';
  ctx.font = '20px Arial, sans-serif';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 20, 22);
  ctx.textAlign = 'right';
  ctx.fillText('最高: ' + best, W - 20, 22);
  if (state === PLAYING) return;
  ctx.fillStyle = 'rgba(17, 24, 39, 0.84)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f9fafb';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px Arial, sans-serif';
  if (state === READY) {
    ctx.fillText('重力翻转小人', W / 2, 315);
    ctx.font = '22px Arial, sans-serif';
    ctx.fillText('点击或按空格开始', W / 2, 385);
  } else {
    ctx.fillText('游戏结束', W / 2, 270);
    ctx.font = '24px Arial, sans-serif';
    ctx.fillText('分数: ' + score, W / 2, 335);
    ctx.fillText('最高: ' + best, W / 2, 380);
    ctx.font = '22px Arial, sans-serif';
    ctx.fillText('点击或按空格重开', W / 2, 450);
  }
}

window.addEventListener('keydown', event => {
  if (event.code !== 'Space' && event.key !== ' ') return;
  event.preventDefault();
  if (!event.repeat) handleFlip();
});
canvas.addEventListener('mousedown', event => {
  if (event.button !== 0 || performance.now() - lastTouchTime < 800) return;
  event.preventDefault();
  handleFlip();
});
canvas.addEventListener('touchstart', event => {
  event.preventDefault();
  lastTouchTime = performance.now();
  if (event.touches.length === 1) handleFlip();
}, { passive: false });
window.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { lastTime = null; });

function loop(now) {
  const dt = lastTime === null ? 0 : clamp((now - lastTime) / 1000, 0, MAX_DT);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetGame();
state = READY;
requestAnimationFrame(loop);
</script>
</body>
</html>
