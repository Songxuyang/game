<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>重力翻转小人 MVP v1.2</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: #f9fafb; background: #1f2937; border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
[hidden] { display: none !important; }
body { font-family: Arial, sans-serif; color: #f9fafb; display: flex; align-items: center; justify-content: center; background: #090e19; touch-action: auto; }
 .game-shell { width: min(100vw, calc((100vh - 84px) * 2 / 3)); position: relative; }
.toolbar { height: 42px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.toast-slot { height: 34px; display: flex; justify-content: center; align-items: center; }
#achievement-toast { margin: 0; font-size: 14px; color: #facc15; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
#achievement-toast.visible { opacity: 1; }
canvas { display: block; width: 100%; height: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 480 / 720; background: #111827; touch-action: none; }
@supports (height: 100dvh) { .game-shell { width: min(100vw, calc((100dvh - 84px) * 2 / 3)); } }
#achievement-panel { position: fixed; inset: 0; z-index: 10; padding: 16px; display: flex; justify-content: center; align-items: center; background: rgba(3, 7, 18, .8); }
.achievement-card { width: min(100%, 460px); max-height: 85vh; max-height: 85dvh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 20px; background: #111827; border: 1px solid #475569; border-radius: 12px; }
.achievement-card h2 { margin: 0 0 8px; font-size: 24px; }
.achievement-card p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
.achievement-card ul { list-style: none; padding: 0; margin: 16px 0; }
.achievement-card li { padding: 12px 0; border-bottom: 1px solid #374151; font-size: 15px; }
.achievement-card li small { display: block; margin-top: 5px; color: #9ca3af; }
.achievement-card li.unlocked strong { color: #facc15; }
#close-achievements { width: 100%; }
</style>
</head>
<body>
<main class="game-shell">
<div class="toolbar" aria-label="游戏设置">
<button id="sound-toggle" type="button" aria-pressed="true">音效: 开</button>
<button id="achievement-toggle" type="button" aria-expanded="false" aria-controls="achievement-panel">成就</button>
</div>
<div class="toast-slot"><p id="achievement-toast" role="status" aria-live="polite"></p></div>
<canvas id="game" tabindex="-1" width="480" height="720" aria-label="重力翻转小人：点击、触摸或按空格开始和翻转重力">你的浏览器不支持 Canvas。</canvas>
</main>
<div id="achievement-panel" hidden>
<section id="achievement-card" class="achievement-card" role="dialog" aria-modal="true" aria-labelledby="achievement-title" tabindex="-1">
<h2 id="achievement-title">成就</h2>
<p>查看期间游戏暂时停止。点击面板或关闭按钮返回，也可按 A 或 Esc。</p>
<ul id="achievement-list"></ul>
<button id="close-achievements" type="button">关闭</button>
</section>
</div>
<script>
'use strict';
const W = 480, H = 720;
const PLAYER_SIZE = 28, PLAYER_X = 120, PLAYER_INITIAL_Y = 120;
const GRAVITY = 1600, MAX_VY = 650, FLIP_IMPULSE = 200;
const PLATFORM_H = 18, PLATFORM_MIN_W = 140, PLATFORM_MAX_W = 240;
const BASE_SPEED = 140, SPEED_PER_SCORE = 6, MAX_SPEED = 340;
const PLATFORM_MIN_Y = 80, PLATFORM_MAX_Y = H - 80 - PLATFORM_H;
const MAX_VERTICAL_DELTA = 260, MIN_GAP = 180, MAX_GAP = 300;
const COLLISION_TOLERANCE = 8, MAX_DT = 0.033;
const COIN_RADIUS = 10, COIN_CHANCE = 0.6, COIN_SPEED_FACTOR = 0.85;
const COMBO_TIMEOUT = 4, PARTICLE_GRAVITY = 400;
const SPIKE_W = 14, SPIKE_H = 12, SPIKE_EDGE = 35, SPIKE_GAP = 50;
const SOUND_KEY = 'gravity_flip_sound_enabled';
const ACHIEVEMENTS_KEY = 'gravity_flip_achievements', STATS_KEY = 'gravity_flip_stats';
const BEST_KEY = 'gravity_flip_best';
const READY = 'READY', PLAYING = 'PLAYING', GAME_OVER = 'GAME_OVER';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let state = READY, player, platforms, standingPlatform;
let gravityDir = 1, score = 0, best = 0, nextGap = 0;
let coins = [], particles = [];
let combo = 0, maxCombo = 0, lastScoreTime = 0, gameTime = 0;
let runCoins = 0, runFlips = 0, runTime = 0, runMovingPlatformStands = 0, deathCause = '';
let audioContext = null, soundEnabled = true, achievementPanelOpen = false;
let toastQueue = [], toastActive = false, panelReturnFocus = null;
let lastTime = null, lastTouchTime = -Infinity;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const random = (min, max) => min + Math.random() * (max - min);
try {
  const saved = Number(localStorage.getItem(BEST_KEY));
  if (Number.isSafeInteger(saved) && saved >= 0) best = saved;
} catch (_) { /* 存储不可用时仍可正常游戏。 */ }

const lerp = (a, b, t) => a + (b - a) * t;
function getDifficulty() { return Math.min(score / 30, 1); }
function getNextGap() {
  return lerp(random(MIN_GAP, MAX_GAP), random(140, 240), getDifficulty());
}

// 音效只在用户交互中初始化；不支持或被禁用时静默降级。
function initAudio() {
  if (!soundEnabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    if (!audioContext) audioContext = new AudioContextClass();
    if (audioContext.state === 'suspended') {
      const resumed = audioContext.resume();
      if (resumed && resumed.catch) resumed.catch(() => {});
    }
  } catch (_) { audioContext = null; }
}

function playSound(type) {
  if (!soundEnabled || !audioContext || audioContext.state !== 'running') return;
  try {
    const start = audioContext.currentTime;
    const tone = (frequency, duration, wave = 'sine', delay = 0, volume = 0.04, endFrequency = null) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const when = start + delay;
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(frequency, when);
      if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(endFrequency, when + duration);
      gain.gain.setValueAtTime(0, when);
      gain.gain.linearRampToValueAtTime(volume, when + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
      oscillator.start(when);
      oscillator.stop(when + duration + 0.01);
    };
    if (type === 'flip') tone(520, 0.05);
    else if (type === 'score' || type === 'combo') tone(660 * (type === 'combo' ? 1.2 : 1), 0.08, 'triangle');
    else if (type === 'coin') { tone(880, 0.05); tone(1320, 0.05, 'sine', 0.065); }
    else if (type === 'death' || type === 'spike_death') {
      tone(180, 0.25, 'sawtooth', 0, 0.05, 60);
      if (type === 'spike_death') tone(1200, 0.04, 'square', 0, 0.03);
    } else if (type === 'achievement') {
      [660, 880, 1100].forEach((frequency, i) => tone(frequency, 0.07, 'triangle', i * 0.09));
    }
  } catch (_) { /* 音效失败不影响游戏。 */ }
}

function renderSoundButton() {
  const button = document.getElementById('sound-toggle');
  button.textContent = '音效: ' + (soundEnabled ? '开' : '关');
  button.setAttribute('aria-pressed', String(soundEnabled));
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem(SOUND_KEY, soundEnabled ? '1' : '0'); } catch (_) {}
  if (soundEnabled) initAudio();
  else if (audioContext && audioContext.state === 'running') {
    try { audioContext.suspend().catch(() => {}); } catch (_) {}
  }
  renderSoundButton();
}

const ACHIEVEMENTS = [
  { id: 'first_fall', name: '初次坠落', condition: '完成第一局', test: () => stats.totalGames >= 1 },
  { id: 'score_10', name: '小试牛刀', condition: '单局得分达到 10', test: () => score >= 10 },
  { id: 'score_25', name: '重力大师', condition: '单局得分达到 25', test: () => score >= 25 },
  { id: 'combo_5', name: '连击新星', condition: '单局最高连击达到 5', test: () => maxCombo >= 5 },
  { id: 'run_coins_10', name: '金币猎人', condition: '单局收集 10 枚金币', test: () => runCoins >= 10 },
  { id: 'total_coins_50', name: '积少成多', condition: '累计收集 50 枚金币', test: () => stats.totalCoins >= 50 },
  { id: 'run_flips_50', name: '空中飞人', condition: '单局翻转 50 次', test: () => runFlips >= 50 },
  { id: 'moving_5', name: '移动靶心', condition: '单局站上 5 个新移动平台', test: () => runMovingPlatformStands >= 5 },
  { id: 'survive_60', name: '生存专家', condition: '单局存活 60 秒', test: () => runTime >= 60 },
  { id: 'total_games_20', name: '百战不殆', condition: '累计完成 20 局', test: () => stats.totalGames >= 20 }
];

function loadAchievements() {
  try {
    const saved = JSON.parse(localStorage.getItem(ACHIEVEMENTS_KEY));
    if (Array.isArray(saved)) return [...new Set(saved.filter(id => ACHIEVEMENTS.some(item => item.id === id)))];
  } catch (_) {}
  return [];
}
function saveAchievements() {
  try { localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(unlockedAchievements)); } catch (_) {}
}
function loadStats() {
  const result = { totalGames: 0, totalCoins: 0, totalFlips: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(STATS_KEY));
    for (const key of Object.keys(result)) {
      if (saved && Number.isSafeInteger(saved[key]) && saved[key] >= 0) result[key] = saved[key];
    }
  } catch (_) {}
  return result;
}
function saveStats() {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (_) {}
}
let unlockedAchievements = loadAchievements();
const stats = loadStats();
try { soundEnabled = localStorage.getItem(SOUND_KEY) !== '0'; } catch (_) {}
renderSoundButton();

function showAchievementToast(name) {
  if (name) toastQueue.push(name);
  if (toastActive || !toastQueue.length) return;
  toastActive = true;
  const toast = document.getElementById('achievement-toast');
  toast.textContent = '成就解锁：' + toastQueue.shift();
  toast.classList.add('visible');
  setTimeout(() => {
    toast.classList.remove('visible');
    setTimeout(() => { toastActive = false; showAchievementToast(); }, 300);
  }, 2000);
}

function unlockAchievement(id) {
  const item = ACHIEVEMENTS.find(achievement => achievement.id === id);
  if (!item || unlockedAchievements.includes(id)) return;
  unlockedAchievements.push(id);
  saveAchievements();
  playSound('achievement');
  showAchievementToast(item.name);
  if (achievementPanelOpen) renderAchievementPanel();
}
function checkAchievements() {
  for (const item of ACHIEVEMENTS) {
    if (!unlockedAchievements.includes(item.id) && item.test()) unlockAchievement(item.id);
  }
}
function renderAchievementPanel() {
  const list = document.getElementById('achievement-list');
  list.replaceChildren();
  for (const item of ACHIEVEMENTS) {
    const unlocked = unlockedAchievements.includes(item.id);
    const row = document.createElement('li');
    row.className = unlocked ? 'unlocked' : '';
    const title = document.createElement('strong');
    title.textContent = (unlocked ? '已解锁 · ' : '未解锁 · ') + item.name;
    const description = document.createElement('small');
    description.textContent = item.condition;
    row.append(title, description);
    list.append(row);
  }
}
function toggleAchievementPanel() {
  achievementPanelOpen = !achievementPanelOpen;
  document.getElementById('achievement-panel').hidden = !achievementPanelOpen;
  document.getElementById('achievement-toggle').setAttribute('aria-expanded', String(achievementPanelOpen));
  lastTime = null;
  if (achievementPanelOpen) {
    panelReturnFocus = document.activeElement;
    renderAchievementPanel();
    const card = document.getElementById('achievement-card');
    card.scrollTop = 0;
    card.focus({ preventScroll: true });
  } else if (panelReturnFocus && panelReturnFocus.focus) panelReturnFocus.focus();
}

function updateSpikes(platform) {
  platform.spikes = [];
  const difficulty = getDifficulty();
  if (platform.moving || platform.w < 160 || difficulty < 0.15 || Math.random() >= lerp(0.15, 0.45, difficulty)) return;
  const count = platform.w >= 200 && difficulty >= 0.45 && Math.random() < 0.3 ? 2 : 1;
  // 预留两端完整安全区；两枚尖刺之间保留至少 50 像素净空。
  const first = random(SPIKE_EDGE, platform.w - SPIKE_EDGE - SPIKE_W);
  platform.spikes.push({ offsetX: first, w: SPIKE_W, h: SPIKE_H, side: 'top' });
  if (count === 2) {
    const choices = [];
    if (first - SPIKE_GAP - SPIKE_W >= SPIKE_EDGE) choices.push([SPIKE_EDGE, first - SPIKE_GAP - SPIKE_W]);
    if (first + SPIKE_W + SPIKE_GAP <= platform.w - SPIKE_EDGE - SPIKE_W) choices.push([first + SPIKE_W + SPIKE_GAP, platform.w - SPIKE_EDGE - SPIKE_W]);
    if (choices.length) {
      const range = choices[Math.floor(Math.random() * choices.length)];
      platform.spikes.push({ offsetX: random(range[0], range[1]), w: SPIKE_W, h: SPIKE_H, side: 'top' });
    }
  }
}
function checkSpikeCollision() {
  for (const platform of platforms) {
    for (const spike of platform.spikes || []) {
      const x = platform.x + spike.offsetX + 2;
      const y = platform.y - spike.h + 4;
      if (player.x < x + spike.w - 4 && player.x + PLAYER_SIZE > x &&
          player.y < y + spike.h - 4 && player.y + PLAYER_SIZE > y) {
        gameOver('spike');
        return true;
      }
    }
  }
  return false;
}
function drawSpikes(platform) {
  for (const spike of platform.spikes || []) {
    const x = platform.x + spike.offsetX;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x, platform.y);
    ctx.lineTo(x + spike.w / 2, platform.y - spike.h);
    ctx.lineTo(x + spike.w, platform.y);
    ctx.closePath();
    ctx.fill();
  }
}

function updateBest() {
  if (score <= best) return;
  best = score;
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
}

function resetGame() {
  player = { x: PLAYER_X, y: PLAYER_INITIAL_Y, vy: 0 };
  gravityDir = 1;
  standingPlatform = null;
  score = 0;
  runCoins = runFlips = runTime = runMovingPlatformStands = 0;
  deathCause = '';
  combo = maxCombo = lastScoreTime = gameTime = 0;
  coins = [];
  particles = [];
  platforms = [{ x: 80, y: 420, w: 220, h: PLATFORM_H, scored: false, moving: false, baseY: 420, previousY: 420, spikes: [] }];
  nextGap = getNextGap();
  lastTime = null;
  state = PLAYING;
}

function spawnPlatform() {
  const difficulty = getDifficulty();
  const previous = platforms[platforms.length - 1];
  const delta = lerp(MAX_VERTICAL_DELTA, 360, difficulty);
  const minY = previous ? Math.max(PLATFORM_MIN_Y, previous.y - delta) : PLATFORM_MIN_Y;
  const maxY = previous ? Math.min(PLATFORM_MAX_Y, previous.y + delta) : PLATFORM_MAX_Y;
  const y = random(minY, maxY);
  const platform = {
    x: W + 40, y, previousY: y, baseY: y,
    w: clamp(lerp(220, 130, difficulty) + random(-20, 20), 110, PLATFORM_MAX_W),
    h: PLATFORM_H, scored: false,
    moving: Math.random() < lerp(0, 0.35, difficulty),
    amp: random(40, 100), phase: random(0, Math.PI * 2),
    angularSpeed: random(1.2, 2.6)
  };
  // 保持生成高度连续；摆动抵达安全区边缘时限制高度。
  if (platform.moving) {
    platform.baseY = y - Math.sin(gameTime * platform.angularSpeed + platform.phase) * platform.amp;
  }
  updateSpikes(platform);
  platforms.push(platform);
  if (Math.random() < COIN_CHANCE) {
    let coinY = platform.y + platform.h / 2 - 45;
    if (coinY < 100 || coinY > H - 100) coinY = platform.y + platform.h / 2 + 45;
    coins.push({ x: platform.x + platform.w / 2, y: coinY, r: COIN_RADIUS, collected: false });
  }
  nextGap = getNextGap();
}

function updateMovingPlatforms(dt, time) {
  for (const platform of platforms) {
    platform.previousY = platform.y;
    if (platform.moving) {
      platform.y = clamp(platform.baseY + Math.sin(time * platform.angularSpeed + platform.phase) * platform.amp,
        PLATFORM_MIN_Y, PLATFORM_MAX_Y);
    }
  }
}

function updateCoins(dt) {
  const speed = Math.min(BASE_SPEED + score * SPEED_PER_SCORE, MAX_SPEED);
  for (const coin of coins) coin.x -= speed * COIN_SPEED_FACTOR * dt;
  coins = coins.filter(coin => !coin.collected && coin.x + coin.r >= 0);
}

function checkCoinCollision() {
  for (const coin of coins) {
    const dx = coin.x - clamp(coin.x, player.x, player.x + PLAYER_SIZE);
    const dy = coin.y - clamp(coin.y, player.y, player.y + PLAYER_SIZE);
    if (dx * dx + dy * dy < coin.r * coin.r) {
      coin.collected = true;
      score += 1;
      runCoins += 1;
      stats.totalCoins += 1;
      saveStats();
      playSound('coin');
      checkAchievements();
      spawnParticles(coin.x, coin.y, 12, '#facc15', 0.5);
      updateBest();
    }
  }
  coins = coins.filter(coin => !coin.collected);
}

function updateCombo(dt, now) {
  if (now - lastScoreTime > COMBO_TIMEOUT) combo = 0;
}

function spawnParticles(x, y, count, color, life = 0.4) {
  for (let i = 0; i < count; i++) {
    const angle = random(0, Math.PI * 2), speed = random(80, 180);
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life, maxLife: life, color, size: random(2, 5) });
  }
}

function updateParticles(dt) {
  for (const particle of particles) {
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vy += PARTICLE_GRAVITY * dt;
    particle.life -= dt;
  }
  particles = particles.filter(particle => particle.life > 0);
}

function drawParticles() {
  ctx.save();
  for (const particle of particles) {
    ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
    ctx.fillStyle = particle.color;
    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
  }
  ctx.restore();
}

function handleFlip() {
  if (achievementPanelOpen) return;
  initAudio();
  if (state !== PLAYING) { resetGame(); return; }
  runFlips += 1;
  stats.totalFlips += 1;
  saveStats();
  playSound('flip');
  checkAchievements();
  standingPlatform = null;
  spawnParticles(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 8, '#fbbf24', 0.35);
  gravityDir *= -1;
  player.vy = gravityDir * FLIP_IMPULSE;
}

function checkCollision(previousY) {
  let landing = null;
  let firstContact = Infinity;
  for (const platform of platforms) {
    const overlapX = player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w;
    if (!overlapX) continue;
    const oldY = platform.previousY ?? platform.y;
    // 对玩家与平台的相对位移做跨面检测，兼容上下摆动。
    const oldDistance = gravityDir === 1
      ? previousY + PLAYER_SIZE - oldY
      : oldY + platform.h - previousY;
    const newDistance = gravityDir === 1
      ? player.y + PLAYER_SIZE - platform.y
      : platform.y + platform.h - player.y;
    const approaching = newDistance >= oldDistance;
    const correctVelocity = gravityDir === 1 ? player.vy >= 0 : player.vy <= 0;
    const crossed = correctVelocity && approaching && oldDistance <= 0 && newDistance >= 0;
    const overlapY = player.y + PLAYER_SIZE >= platform.y && player.y <= platform.y + platform.h;
    const near = correctVelocity && approaching && overlapY &&
      oldDistance <= COLLISION_TOLERANCE && Math.abs(newDistance) <= COLLISION_TOLERANCE;
    const contact = -oldDistance / (newDistance - oldDistance || 1);
    // 跨面检测补充 AABB，避免高速下落时一帧穿过平台。
    if ((crossed || near) && Math.max(0, contact) < firstContact) {
      firstContact = Math.max(0, contact);
      landing = platform;
    }
  }
  if (!landing) return;
  player.y = gravityDir === 1 ? landing.y - PLAYER_SIZE : landing.y + landing.h;
  player.vy = 0;
  standingPlatform = landing;
  if (!landing.scored) {
    landing.scored = true;
    combo += 1;
    maxCombo = Math.max(maxCombo, combo);
    lastScoreTime = gameTime;
    score += combo >= 3 ? 2 : 1;
    if (landing.moving) runMovingPlatformStands += 1;
    playSound(combo >= 3 ? 'combo' : 'score');
    checkAchievements();
    spawnParticles(player.x + PLAYER_SIZE / 2,
      gravityDir === 1 ? player.y + PLAYER_SIZE : player.y, 10, '#22c55e', 0.4);
    updateBest();
  }
}

function gameOver(cause = 'boundary') {
  if (state !== PLAYING) return;
  deathCause = cause;
  stats.totalGames += 1;
  saveStats();
  playSound(cause === 'spike' ? 'spike_death' : 'death');
  checkAchievements();
  state = GAME_OVER;
  combo = 0;
  spawnParticles(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 20, '#ef4444', 0.6);
  updateBest();
}

function update(dt) {
  if (achievementPanelOpen) return;
  if (state === GAME_OVER) { updateParticles(dt); return; }
  if (state !== PLAYING) return;
  gameTime += dt;
  runTime += dt;
  checkAchievements();
  updateCombo(dt, gameTime);
  updateParticles(dt);
  const currentSpeed = Math.min(BASE_SPEED + score * SPEED_PER_SCORE, MAX_SPEED);
  for (const platform of platforms) platform.x -= currentSpeed * dt;
  updateMovingPlatforms(dt, gameTime);
  updateCoins(dt);
  if (standingPlatform) {
    const platform = standingPlatform;
    if (player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w) {
      player.y = gravityDir === 1 ? platform.y - PLAYER_SIZE : platform.y + platform.h;
      player.vy = 0;
    } else {
      standingPlatform = null;
      player.vy = 0;
    }
  }
  if (!standingPlatform) {
    const previousY = player.y;
    player.vy = clamp(player.vy + gravityDir * GRAVITY * dt, -MAX_VY, MAX_VY);
    player.y += player.vy * dt;
    if (checkSpikeCollision()) return;
    checkCollision(previousY);
  }
  if (player.y < 0 || player.y + PLAYER_SIZE > H) { gameOver(); return; }
  if (checkSpikeCollision()) return;
  checkCoinCollision();
  const latest = platforms[platforms.length - 1];
  if (!latest || latest.x < W - nextGap) spawnPlatform();
  platforms = platforms.filter(platform => platform.x + platform.w >= 0);
}

function draw() {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(0, 0, W, 2);
  ctx.fillRect(0, H - 2, W, 2);
  ctx.fillStyle = '#22c55e';
  for (const platform of platforms) {
    ctx.fillStyle = platform.moving ? '#38bdf8' : '#22c55e';
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    drawSpikes(platform);
  }
  ctx.fillStyle = '#facc15';
  for (const coin of coins) {
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = '#f9fafb';
  ctx.font = '20px Arial, sans-serif';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 20, 22);
  if (combo >= 2) {
    ctx.fillStyle = '#facc15';
    ctx.fillText('连击 x' + combo, 20, 50);
    ctx.fillStyle = '#f9fafb';
  }
  ctx.textAlign = 'right';
  ctx.fillText('最高: ' + best, W - 20, 22);
  if (state === PLAYING) { drawParticles(); return; }
  ctx.fillStyle = 'rgba(17, 24, 39, 0.84)';
  ctx.fillRect(0, 0, W, H);
  drawParticles();
  ctx.fillStyle = '#f9fafb';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px Arial, sans-serif';
  if (state === READY) {
    ctx.fillText('重力翻转小人', W / 2, 315);
    ctx.font = '22px Arial, sans-serif';
    ctx.fillText('点击或按空格开始', W / 2, 385);
    ctx.font = '18px Arial, sans-serif';
    ctx.fillText('成就: ' + unlockedAchievements.length + ' / ' + ACHIEVEMENTS.length, W / 2, 435);
  } else {
    ctx.fillText('游戏结束', W / 2, 270);
    ctx.font = '24px Arial, sans-serif';
    ctx.fillText('分数: ' + score, W / 2, 335);
    ctx.fillText('最高: ' + best, W / 2, 380);
    ctx.fillText('最高连击: ' + maxCombo, W / 2, 425);
    ctx.font = '22px Arial, sans-serif';
    ctx.fillText('点击或按空格重开', W / 2, 485);
    ctx.font = '18px Arial, sans-serif';
    ctx.fillText('成就: ' + unlockedAchievements.length + ' / ' + ACHIEVEMENTS.length, W / 2, 530);
    if (deathCause === 'spike') {
      ctx.fillStyle = '#f87171';
      ctx.fillText('被尖刺刺中', W / 2, 570);
    }
  }
}

// DOM 控件独立消费输入，触摸产生的后续 click 也不会传入画布。
for (const id of ['sound-toggle', 'achievement-toggle', 'close-achievements', 'achievement-panel']) {
  const element = document.getElementById(id);
  for (const eventName of ['mousedown', 'touchstart']) {
    element.addEventListener(eventName, event => event.stopPropagation());
  }
}
document.getElementById('sound-toggle').addEventListener('click', event => {
  event.stopPropagation();
  toggleSound();
});
document.getElementById('achievement-toggle').addEventListener('click', event => {
  event.stopPropagation();
  initAudio();
  toggleAchievementPanel();
});
document.getElementById('achievement-panel').addEventListener('click', event => {
  event.stopPropagation();
  if (achievementPanelOpen) toggleAchievementPanel();
});
window.addEventListener('keydown', event => {
  if (event.code === 'KeyM' || event.key.toLowerCase() === 'm') {
    event.preventDefault();
    if (!event.repeat) toggleSound();
    return;
  }
  if (event.code === 'KeyA' || event.key.toLowerCase() === 'a') {
    event.preventDefault();
    initAudio();
    if (!event.repeat) toggleAchievementPanel();
    return;
  }
  if (achievementPanelOpen) {
    if (event.key === 'Escape') { event.preventDefault(); toggleAchievementPanel(); }
    else if (event.key === 'Tab') {
      event.preventDefault();
      document.getElementById('close-achievements').focus();
    } else if (event.code === 'Space' || event.key === ' ') event.preventDefault();
    return;
  }
  if (event.code !== 'Space' && event.key !== ' ') return;
  event.preventDefault();
  // 已聚焦按钮用空格激活时，不把同一按键当作翻转。
  if (event.target && event.target.tagName === 'BUTTON') {
    if (!event.repeat) event.target.click();
    return;
  }
  if (!event.repeat) handleFlip();
});
canvas.addEventListener('mousedown', event => {
  if (event.button !== 0 || performance.now() - lastTouchTime < 800) return;
  event.preventDefault();
  canvas.focus({ preventScroll: true });
  handleFlip();
});
canvas.addEventListener('touchstart', event => {
  event.preventDefault();
  lastTouchTime = performance.now();
  if (event.touches.length === 1) {
    canvas.focus({ preventScroll: true });
    handleFlip();
  }
}, { passive: false });
window.addEventListener('touchmove', event => {
  if (achievementPanelOpen && event.target.closest('.achievement-card')) return;
  event.preventDefault();
}, { passive: false });
document.addEventListener('visibilitychange', () => { lastTime = null; });

function loop(now) {
  const dt = lastTime === null ? 0 : clamp((now - lastTime) / 1000, 0, MAX_DT);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetGame();
state = READY;
requestAnimationFrame(loop);
</script>
</body>
</html>
