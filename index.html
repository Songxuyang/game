<!DOCTYPE html>

<style>
* { box-sizing: border-box; }

html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }

button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
[hidden] { display: none !important; }
.game-shell { width: min(480px, 100vw, calc(100vh * 2 / 3)); }

.toolbar { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 6px; }
#achievement-toast { position: absolute; top: 14px; left: 50%; z-index: 30; width: max-content; max-width: calc(100% - 24px); margin: 0; padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,.75); color: #f9fafb; font-size: 14px; line-height: 1.4; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.4); opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; pointer-events: none; }

.game-panel { position: absolute; inset: 0; z-index: 20; background: rgba(15,23,42,.92); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }

.panel-close { width: 100%; margin-top: 12px; min-height: 38px; }
.skin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.skin-option { display: flex; align-items: center; flex-direction: column; gap: 5px; min-height: 140px; padding: 12px 6px; border: 2px solid transparent; border-radius: 8px; background: rgba(255,255,255,.05); }
.skin-option.equipped { border-color: var(--card-accent); background: rgba(255,255,255,.1); }
.skin-option strong { font-size: 14px; }
.skin-option small { color: #cbd5e1; font-size: 12px; }

#effects-toggle { margin: 0 0 14px; min-height: 36px; }

<body>
<main class="game-shell">
<div class="canvas-frame">
<canvas id="game" tabindex="-1" width="480" height="720" aria-label="重力翻转小人：点击、触摸或按空格开始和翻转重力">你的浏览器不支持 Canvas。</canvas>

const lerp = (a, b, t) => a + (b - a) * t;

// 音效只在用户交互中初始化；不支持或被禁用时静默降级。
function initAudio() {
  if (!soundEnabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    if (!audioContext) audioContext = new AudioContextClass();
    if (audioContext.state === 'suspended') {
      const resumed = audioContext.resume();
      if (resumed && resumed.catch) resumed.catch(() => {});
    }
  } catch (_) { audioContext = null; }
}

function playSound(type) {
  if (!soundEnabled || !audioContext || audioContext.state !== 'running') return;
  try {
    const start = audioContext.currentTime;
    const tone = (frequency, duration, wave = 'sine', delay = 0, volume = 0.04, endFrequency = null) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const when = start + delay;
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(frequency, when);
      if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(endFrequency, when + duration);
      gain.gain.setValueAtTime(0, when);
      gain.gain.linearRampToValueAtTime(volume, when + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
      oscillator.start(when);
      oscillator.stop(when + duration + 0.01);
    };
    if (type === 'flip') tone(520, 0.05);
    else if (type === 'score' || type === 'combo') tone(660 * (type === 'combo' ? 1.2 : 1), 0.08, 'triangle');
    else if (type === 'coin') { tone(880, 0.05); tone(1320, 0.05, 'sine', 0.065); }
    else if (type === 'death' || type === 'spike_death') {
      tone(180, 0.25, 'sawtooth', 0, 0.05, 60);
      if (type === 'spike_death') tone(1200, 0.04, 'square', 0, 0.03);
    } else if (type === 'achievement') {
      [660, 880, 1100].forEach((frequency, i) => tone(frequency, 0.07, 'triangle', i * 0.09));
    }
  } catch (_) { /* 音效失败不影响游戏。 */ }
}

function renderSoundButton() {
  const button = document.getElementById('sound-toggle');
  button.textContent = '音效: ' + (soundEnabled ? '开' : '关');
  button.setAttribute('aria-pressed', String(soundEnabled));
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem(SOUND_KEY, soundEnabled ? '1' : '0'); } catch (_) {}
  if (soundEnabled) initAudio();
  else if (audioContext && audioContext.state === 'running') {
    try { audioContext.suspend().catch(() => {}); } catch (_) {}
  }
  renderSoundButton();
}

    if (Array.isArray(saved)) return [...new Set(saved.filter(id => ACHIEVEMENTS.some(item => item.id === id)))];

}
function saveAchievements() {
  try { localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(unlockedAchievements)); } catch (_) {}
}
function loadStats() {

function unlockAchievement(id) {
  const item = ACHIEVEMENTS.find(achievement => achievement.id === id);
  if (!item || unlockedAchievements.includes(id)) return;
  unlockedAchievements.push(id);
  saveAchievements();
  playSound('achievement');
  showAchievementToast(item.name);
  if (achievementPanelOpen) renderAchievementPanel();
}
function checkAchievements() {
  for (const item of ACHIEVEMENTS) {
    if (!unlockedAchievements.includes(item.id) && item.test()) unlockAchievement(item.id);

function renderAchievementPanel() {

function updateSpikes(platform) {
  platform.spikes = [];
  const difficulty = getDifficulty();
  if (platform.moving || platform.w < 160 || difficulty < 0.15 || Math.random() >= lerp(0.15, 0.45, difficulty)) return;
  const count = platform.w >= 200 && difficulty >= 0.45 && Math.random() < 0.3 ? 2 : 1;
  // 预留两端完整安全区；两枚尖刺之间保留至少 50 像素净空。
  const first = random(SPIKE_EDGE, platform.w - SPIKE_EDGE - SPIKE_W);
  platform.spikes.push({ offsetX: first, w: SPIKE_W, h: SPIKE_H, side: 'top' });
  if (count === 2) {
    const choices = [];
    if (first - SPIKE_GAP - SPIKE_W >= SPIKE_EDGE) choices.push([SPIKE_EDGE, first - SPIKE_GAP - SPIKE_W]);
    if (first + SPIKE_W + SPIKE_GAP <= platform.w - SPIKE_EDGE - SPIKE_W) choices.push([first + SPIKE_W + SPIKE_GAP, platform.w - SPIKE_EDGE - SPIKE_W]);
    if (choices.length) {
      const range = choices[Math.floor(Math.random() * choices.length)];
      platform.spikes.push({ offsetX: random(range[0], range[1]), w: SPIKE_W, h: SPIKE_H, side: 'top' });
    }
  }
}
function checkSpikeCollision() {
  for (const platform of platforms) {
    for (const spike of platform.spikes || []) {
      const x = platform.x + spike.offsetX + 2;
      const y = platform.y - spike.h + 4;
      if (player.x < x + spike.w - 4 && player.x + PLAYER_SIZE > x &&
          player.y < y + spike.h - 4 && player.y + PLAYER_SIZE > y) {
        gameOver('spike');
        return true;
      }
    }
  }
  return false;
}
function drawSpikes(platform) {
  for (const spike of platform.spikes || []) {
    const x = platform.x + spike.offsetX;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x, platform.y);
    ctx.lineTo(x + spike.w / 2, platform.y - spike.h);
    ctx.lineTo(x + spike.w, platform.y);
    ctx.closePath();
    ctx.fill();
  }
}

function getCurrentSkin() { return currentSkin; }
function applySkinTheme() {
  document.documentElement.style.setProperty('--accent', currentSkin.accentColor);
  document.documentElement.style.setProperty('--skin-text', currentSkin.textColor);
}
applySkinTheme();

function buySkin(id) {
  const skin = SKINS.find(item => item.id === id);
  if (!skin) return false;
  if (unlockedSkins.includes(id)) return selectSkin(id);
  if (skin.price > wallet) { showToast('金币不足'); return false; }
  wallet -= skin.price;
  saveWallet();
  unlockedSkins.push(id);
  saveUnlockedSkins();
  selectSkin(id);
  playSound('achievement');
  return true;
}
function selectSkin(id) {
  const skin = SKINS.find(item => item.id === id);
  if (!skin) return false;
  if (!unlockedSkins.includes(id)) return buySkin(id);
  currentSkin = skin;
  initBgParticles();
  for (const particle of particles) {
    particle.color = particle.kind === 'death' ? '#ef4444' : particle.kind === 'coin' ? skin.coinFill : skin.particleColor;
  }
  saveCurrentSkin();
  applySkinTheme();
  if (skinPanelOpen) buildSkinPanel();
  return true;
}
// 小人的绘制始终限制在原来的方形碰撞范围内。
function drawCharacter(context, skin, x, y, size, direction = 1) {
  context.save();
  context.translate(x + size / 2, y + size / 2);
  if (direction === -1) context.rotate(Math.PI);
  context.scale(size / PLAYER_SIZE, size / PLAYER_SIZE);
  context.translate(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2);
  context.lineCap = 'round';
  context.lineJoin = 'round';

  // 四肢用两层线条描边，让不同皮肤下的轮廓仍然清晰。
  const limbs = () => {
    context.beginPath();
    context.moveTo(9, 16); context.lineTo(5, 20);
    context.moveTo(19, 16); context.lineTo(23, 20);
    context.moveTo(11, 20); context.lineTo(9, 25);
    context.moveTo(17, 20); context.lineTo(19, 25);
    context.stroke();
  };
  context.strokeStyle = skin.playerStroke;
  context.lineWidth = 6;
  limbs();
  context.strokeStyle = skin.playerFill;
  context.lineWidth = 3.5;
  limbs();

  context.fillStyle = skin.playerFill;
  context.strokeStyle = skin.playerStroke;
  context.lineWidth = 1.5;
  context.beginPath();
  context.moveTo(11, 13);
  context.lineTo(17, 13);
  context.quadraticCurveTo(20, 13, 20, 16);
  context.lineTo(19, 21);
  context.lineTo(9, 21);
  context.lineTo(8, 16);
  context.quadraticCurveTo(8, 13, 11, 13);
  context.closePath();
  context.fill();
  context.stroke();

  context.beginPath();
  context.arc(14, 7, 6, 0, Math.PI * 2);
  context.fill();
  context.stroke();
  context.fillStyle = '#111827';
  for (const eyeX of [12, 16]) {
    context.beginPath(); context.arc(eyeX, 6.5, 0.8, 0, Math.PI * 2); context.fill();
  }
  context.strokeStyle = '#111827';
  context.lineWidth = 0.8;
  context.beginPath(); context.arc(14, 8.5, 1.5, 0.15, Math.PI - 0.15); context.stroke();
  context.restore();
}
function drawSkinPreview(context, skin, x, y, size) {
  drawCharacter(context, skin, x, y, size);
}
function drawPlayer() {
  drawCharacter(ctx, getCurrentSkin(), player.x, player.y, PLAYER_SIZE, gravityDir);
}
function buildSkinPanel() {
  document.getElementById('skin-wallet').textContent = '金币: ' + wallet;
  renderEffectsButton();
  const grid = document.getElementById('skin-grid');
  const focusedId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.skin : null;
  grid.replaceChildren();
  for (const skin of SKINS) {
    const equipped = currentSkin.id === skin.id;
    const unlocked = unlockedSkins.includes(skin.id);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'skin-option' + (equipped ? ' equipped' : '');
    card.dataset.skin = skin.id;
    card.style.setProperty('--card-accent', skin.accentColor);
    card.setAttribute('aria-pressed', String(equipped));
    const preview = document.createElement('canvas');
    preview.width = preview.height = 44;
    preview.setAttribute('aria-hidden', 'true');
    drawSkinPreview(preview.getContext('2d'), skin, 6, 6, 32);
    const name = document.createElement('strong');
    name.textContent = skin.name;
    const status = document.createElement('small');
    status.textContent = equipped ? '已装备' : unlocked ? '已解锁' : '价格 ' + skin.price + ' 金币';
    card.append(preview, name, status);
    card.addEventListener('click', event => {
      event.stopPropagation();
      initAudio();
      selectSkin(skin.id);
    });
    grid.append(card);
    if (focusedId === skin.id) card.focus({ preventScroll: true });
  }
}

function updateBest() {
  if (score <= best) return;
  best = score;
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
}

function resetGame() {
  player = { x: PLAYER_X, y: PLAYER_INITIAL_Y, vy: 0 };
  gravityDir = 1;
  standingPlatform = null;
  score = 0;
  runCoins = runFlips = runTime = runMovingPlatformStands = 0;
  deathCause = '';
  combo = maxCombo = lastScoreTime = gameTime = 0;
  coins = [];
  particles = [];
  shockwaves = [];
  platforms = [{ x: 80, y: 420, w: 220, h: PLATFORM_H, scored: false, moving: false, baseY: 420, previousY: 420, spikes: [] }];
  nextGap = getNextGap();
  lastTime = null;
  state = PLAYING;
}

function spawnPlatform() {
  const difficulty = getDifficulty();
  const previous = platforms[platforms.length - 1];
  const delta = lerp(MAX_VERTICAL_DELTA, 360, difficulty);
  const minY = previous ? Math.max(PLATFORM_MIN_Y, previous.y - delta) : PLATFORM_MIN_Y;
  const maxY = previous ? Math.min(PLATFORM_MAX_Y, previous.y + delta) : PLATFORM_MAX_Y;
  const y = random(minY, maxY);
  const platform = {
    x: W + 40, y, previousY: y, baseY: y,
    w: clamp(lerp(220, 130, difficulty) + random(-20, 20), 110, PLATFORM_MAX_W),
    h: PLATFORM_H, scored: false,
    moving: Math.random() < lerp(0, 0.35, difficulty),
    amp: random(40, 100), phase: random(0, Math.PI * 2),
    angularSpeed: random(1.2, 2.6)
  };
  // 保持生成高度连续；摆动抵达安全区边缘时限制高度。
  if (platform.moving) {
    platform.baseY = y - Math.sin(gameTime * platform.angularSpeed + platform.phase) * platform.amp;
  }
  updateSpikes(platform);
  platforms.push(platform);
  if (Math.random() < COIN_CHANCE) {
    let coinY = platform.y + platform.h / 2 - 45;
    if (coinY < 100 || coinY > H - 100) coinY = platform.y + platform.h / 2 + 45;
    coins.push({ x: platform.x + platform.w / 2, y: coinY, r: COIN_RADIUS, phase: visualRandom(0, Math.PI * 2), collected: false });
  }
  nextGap = getNextGap();
}

function updateMovingPlatforms(dt, time) {
  for (const platform of platforms) {
    platform.previousY = platform.y;
    if (platform.moving) {
      platform.y = clamp(platform.baseY + Math.sin(time * platform.angularSpeed + platform.phase) * platform.amp,
        PLATFORM_MIN_Y, PLATFORM_MAX_Y);
    }
  }
}

function updateCoins(dt) {
  const speed = Math.min(BASE_SPEED + score * SPEED_PER_SCORE, MAX_SPEED);
  for (const coin of coins) coin.x -= speed * COIN_SPEED_FACTOR * dt;
  coins = coins.filter(coin => !coin.collected && coin.x + coin.r >= 0);
}

function checkCoinCollision() {
  for (const coin of coins) {
    const dx = coin.x - clamp(coin.x, player.x, player.x + PLAYER_SIZE);
    const dy = coin.y - clamp(coin.y, player.y, player.y + PLAYER_SIZE);
    if (dx * dx + dy * dy < coin.r * coin.r) {
      coin.collected = true;
      score += 1;
      wallet += 1;
      saveWallet();
      runCoins += 1;
      stats.totalCoins += 1;
      saveStats();
      playSound('coin');
      checkAchievements();
      spawnParticles(coin.x, coin.y, 12, getCurrentSkin().coinFill, 0.5, 'coin');
      updateBest();
    }
  }
  coins = coins.filter(coin => !coin.collected);
}

function updateCombo(dt, now) {
  if (now - lastScoreTime > COMBO_TIMEOUT) combo = 0;
}

function spawnParticles(x, y, count, color, life = 0.4, kind = 'skin') {
  for (let i = 0; i < count; i++) {
    const angle = random(0, Math.PI * 2), speed = random(80, 180);
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life, maxLife: life, color, kind, size: random(2, 5) });
  }
}

function updateParticles(dt) {
  for (const particle of particles) {
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vy += PARTICLE_GRAVITY * dt;
    particle.life -= dt;
  }
  particles = particles.filter(particle => particle.life > 0);
}

function drawParticles() {
  ctx.save();
  for (const particle of particles) {
    ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
    ctx.fillStyle = particle.color;
    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
  }
  ctx.restore();
}

function handleFlip() {
  if (isPausedByPanel) return;
  initAudio();
  if (state !== PLAYING) { resetGame(); return; }
  runFlips += 1;
  stats.totalFlips += 1;
  saveStats();
  playSound('flip');
  checkAchievements();
  standingPlatform = null;
  spawnParticles(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 8, getCurrentSkin().particleColor, 0.35);
  spawnShockwave();
  gravityDir *= -1;
  player.vy = gravityDir * FLIP_IMPULSE;
}

function checkCollision(previousY) {
  let landing = null;
  let firstContact = Infinity;
  for (const platform of platforms) {
    const overlapX = player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w;
    if (!overlapX) continue;
    const oldY = platform.previousY ?? platform.y;
    // 对玩家与平台的相对位移做跨面检测，兼容上下摆动。
    const oldDistance = gravityDir === 1
      ? previousY + PLAYER_SIZE - oldY
      : oldY + platform.h - previousY;
    const newDistance = gravityDir === 1
      ? player.y + PLAYER_SIZE - platform.y
      : platform.y + platform.h - player.y;
    const approaching = newDistance >= oldDistance;
    const correctVelocity = gravityDir === 1 ? player.vy >= 0 : player.vy <= 0;
    const crossed = correctVelocity && approaching && oldDistance <= 0 && newDistance >= 0;
    const overlapY = player.y + PLAYER_SIZE >= platform.y && player.y <= platform.y + platform.h;
    const near = correctVelocity && approaching && overlapY &&
      oldDistance <= COLLISION_TOLERANCE && Math.abs(newDistance) <= COLLISION_TOLERANCE;
    const contact = -oldDistance / (newDistance - oldDistance || 1);
    // 跨面检测补充 AABB，避免高速下落时一帧穿过平台。
    if ((crossed || near) && Math.max(0, contact) < firstContact) {
      firstContact = Math.max(0, contact);
      landing = platform;
    }
  }
  if (!landing) return;
  player.y = gravityDir === 1 ? landing.y - PLAYER_SIZE : landing.y + landing.h;
  player.vy = 0;
  standingPlatform = landing;
  if (!landing.scored) {
    landing.scored = true;
    combo += 1;
    maxCombo = Math.max(maxCombo, combo);
    lastScoreTime = gameTime;
    score += combo >= 3 ? 2 : 1;
    if (landing.moving) runMovingPlatformStands += 1;
    playSound(combo >= 3 ? 'combo' : 'score');
    checkAchievements();
    spawnParticles(player.x + PLAYER_SIZE / 2,
      gravityDir === 1 ? player.y + PLAYER_SIZE : player.y, 10, getCurrentSkin().particleColor, 0.4);
    updateBest();
  }
}

function gameOver(cause = 'boundary') {
  if (state !== PLAYING) return;
  deathCause = cause;
  shockwaves = [];
  stats.totalGames += 1;
  saveStats();
  playSound(cause === 'spike' ? 'spike_death' : 'death');
  checkAchievements();
  state = GAME_OVER;
  combo = 0;
  spawnParticles(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, 20, '#ef4444', 0.6, 'death');
  updateBest();
}

function update(dt) {
  if (isPausedByPanel) return;
  if (state === GAME_OVER) { updateParticles(dt); return; }
  if (state !== PLAYING) return;
  gameTime += dt;
  runTime += dt;
  checkAchievements();
  updateCombo(dt, gameTime);
  updateParticles(dt);
  const currentSpeed = Math.min(BASE_SPEED + score * SPEED_PER_SCORE, MAX_SPEED);
  for (const platform of platforms) platform.x -= currentSpeed * dt;
  updateMovingPlatforms(dt, gameTime);
  updateCoins(dt);
  if (standingPlatform) {
    const platform = standingPlatform;
    if (player.x + PLAYER_SIZE > platform.x && player.x < platform.x + platform.w) {
      player.y = gravityDir === 1 ? platform.y - PLAYER_SIZE : platform.y + platform.h;
      player.vy = 0;
    } else {
      standingPlatform = null;
      player.vy = 0;
    }
  }
  if (!standingPlatform) {
    const previousY = player.y;
    player.vy = clamp(player.vy + gravityDir * GRAVITY * dt, -MAX_VY, MAX_VY);
    player.y += player.vy * dt;
    if (checkSpikeCollision()) return;
    checkCollision(previousY);
  }
  if (player.y < 0 || player.y + PLAYER_SIZE > H) { gameOver(); return; }
  if (checkSpikeCollision()) return;
  checkCoinCollision();
  const latest = platforms[platforms.length - 1];
  if (!latest || latest.x < W - nextGap) spawnPlatform();
  platforms = platforms.filter(platform => platform.x + platform.w >= 0);
}

// 装饰使用独立随机源，不消耗平台、金币和尖刺生成所用的随机序列。
function visualRandom(min = 0, max = 1) {
  visualSeed = (Math.imul(1664525, visualSeed) + 1013904223) >>> 0;
  return min + (visualSeed / 4294967296) * (max - min);
}
function loadEffectsEnabled() {
  try { return localStorage.getItem(EFFECTS_KEY) !== '0'; } catch (_) { return true; }
}
function saveEffectsEnabled() {
  try { localStorage.setItem(EFFECTS_KEY, effectsEnabled ? '1' : '0'); } catch (_) {}
}
function renderEffectsButton() {
  const button = document.getElementById('effects-toggle');
  button.textContent = '动画特效: ' + (effectsEnabled ? '开' : '关');
  button.setAttribute('aria-pressed', String(effectsEnabled));
}
function toggleEffects() {
  effectsEnabled = !effectsEnabled;
  saveEffectsEnabled();
  shockwaves = [];
  initBgParticles();
  renderEffectsButton();
}
function getHudTop() { return Math.max(68, 54 * W / (canvas.clientWidth || W)); }
function drawPlayerGlow() {
  if (!effectsEnabled || state !== PLAYING) return;
  const wave = (Math.sin(visualTime * 2.2) + 1) / 2;
  const layer = (extra, alpha) => {
    ctx.save();
    // 光晕限制在 HUD 以下，避免覆盖分数与钱包文字。
    const top = getHudTop() + 44;
    ctx.beginPath(); ctx.rect(0, top, W, Math.max(0, H - top)); ctx.clip();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = currentSkin.playerFill;
    roundedCard(player.x - extra / 2, player.y - extra / 2,
      PLAYER_SIZE + extra, PLAYER_SIZE + extra, 9);
    ctx.fill();
    ctx.restore();
  };
  if (performanceLevel === 'high') layer(24, 0.04 + 0.06 * (Math.sin(visualTime * 2.2 + 1.2) + 1) / 2);
  layer(10 + 6 * wave, 0.10 + 0.12 * wave);
}
function drawCoinEffects(coin) {
  ctx.save();
  const phase = coin.phase ?? 0;
  const y = coin.y + (effectsEnabled ? Math.sin(visualTime * 3 + phase) * 3 : 0);
  ctx.fillStyle = currentSkin.coinFill;
  if (effectsEnabled && performanceLevel === 'high') {
    ctx.globalAlpha = 0.12 + 0.13 * (Math.sin(visualTime * 3 + phase) + 1) / 2;
    ctx.beginPath(); ctx.arc(coin.x, y, coin.r + 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(coin.x, y, coin.r, 0, Math.PI * 2); ctx.fill();
  if (effectsEnabled) {
    ctx.globalAlpha = 0.5 + 0.4 * (Math.sin(visualTime * 5 + phase) + 1) / 2;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(coin.x, y, coin.r * 0.55, Math.PI, Math.PI * 1.5); ctx.stroke();
  }
  ctx.restore();
}
function spawnShockwave() {
  if (!effectsEnabled || performanceLevel === 'low' || state !== PLAYING) return;
  shockwaves.push({ x: player.x + PLAYER_SIZE / 2, y: player.y + PLAYER_SIZE / 2,
    radius: 6, maxRadius: 70, life: 0.28, maxLife: 0.28, color: currentSkin.accentColor });
  if (shockwaves.length > MAX_SHOCKWAVES) shockwaves.shift();
}
function updateShockwaves(dt) {
  if (!effectsEnabled || performanceLevel === 'low' || state !== PLAYING) { shockwaves = []; return; }
  for (const wave of shockwaves) {
    wave.life -= dt;
    const t = clamp(1 - wave.life / wave.maxLife, 0, 1);
    wave.radius = 6 + (wave.maxRadius - 6) * t;
  }
  shockwaves = shockwaves.filter(wave => wave.life > 0);
}
function drawShockwaves() {
  if (!effectsEnabled || performanceLevel === 'low' || state !== PLAYING) return;
  ctx.save();
  for (const wave of shockwaves) {
    const t = clamp(1 - wave.life / wave.maxLife, 0, 1);
    ctx.strokeStyle = wave.color;
    ctx.lineWidth = 3 * (1 - t) + 1;
    ctx.globalAlpha = (1 - t) * 0.6;
    ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function getBgLimit() {
  const counts = { stars: 30, petals: 24, embers: 28, fireflies: 22 };
  const factor = performanceLevel === 'medium' ? 0.5 : 1;
  return Math.min(Math.floor(MAX_BG_PARTICLES * factor), Math.floor((counts[currentSkin.bgEffect] || 0) * factor));
}
function initBgParticles() {
  bgParticles = [];
  bgSpawnTime = 0;
  bgStyle = currentSkin.id;
  if (!effectsEnabled || performanceLevel === 'low') return;
  const effect = currentSkin.bgEffect;
  if (effect !== 'stars' && effect !== 'fireflies') return;
  for (let i = 0; i < getBgLimit(); i++) {
    bgParticles.push({ x: visualRandom(2, W - 2), y: effect === 'stars' ? visualRandom(2, H * 0.7) : visualRandom(2, H - 2),
      r: effect === 'stars' ? visualRandom(1, 2) : 2, phase: visualRandom(0, Math.PI * 2),
      vx: visualRandom(-20, 20), vy: visualRandom(-20, 20), bucket: null, index: i });
  }
}
function directionSeed(bucket, index, salt) {
  const value = Math.sin(bucket * 127.1 + index * 311.7 + salt * 74.7) * 43758.5453;
  return (value - Math.floor(value)) * 40 - 20;
}
function updateBgParticles(dt) {
  if (!effectsEnabled || performanceLevel === 'low') { bgParticles = []; bgSpawnTime = 0; return; }
  if (bgStyle !== currentSkin.id) initBgParticles();
  const effect = currentSkin.bgEffect;
  const limit = getBgLimit();
  if (bgParticles.length > limit) bgParticles.length = limit;
  if (effect === 'grid' || effect === 'none' || effect === 'stars') return;
  if (effect === 'petals' || effect === 'embers') {
    const interval = effect === 'petals' ? 0.25 : 0.18;
    bgSpawnTime += dt;
    while (bgSpawnTime >= interval) {
      bgSpawnTime -= interval;
      if (bgParticles.length >= limit) continue;
      const petals = effect === 'petals';
      bgParticles.push({ x: visualRandom(4, W - 4), y: petals ? -10 : H + 10,
        vx: visualRandom(petals ? -20 : -15, petals ? 20 : 15),
        vy: petals ? visualRandom(40, 80) : -visualRandom(50, 110),
        phase: visualRandom(0, Math.PI * 2), r: visualRandom(1, 2) });
    }
  }
  for (const particle of bgParticles) {
    if (effect === 'fireflies') {
      const bucket = Math.floor(visualTime / 2 + particle.phase);
      if (bucket !== particle.bucket) {
        particle.bucket = bucket;
        particle.vx = directionSeed(bucket, particle.index, 1);
        particle.vy = directionSeed(bucket, particle.index, 2);
      }
      particle.x += particle.vx * dt; particle.y += particle.vy * dt;
      if (particle.x < 2 || particle.x > W - 2) { particle.x = clamp(particle.x, 2, W - 2); particle.vx *= -1; }
      if (particle.y < 2 || particle.y > H - 2) { particle.y = clamp(particle.y, 2, H - 2); particle.vy *= -1; }
    } else {
      particle.x += (particle.vx + Math.sin(visualTime * (effect === 'petals' ? 2 : 3) + particle.phase) * (effect === 'petals' ? 20 : 12)) * dt;
      particle.y += particle.vy * dt;
    }
  }
  // 顶部/底部 10px 为生成缓冲带；绘制仍严格裁剪在画布内。
  bgParticles = bgParticles.filter(particle => particle.x >= 0 && particle.x <= W && particle.y >= -10 && particle.y <= H + 10);
}
function drawGridEffect() {
  if (!effectsEnabled || performanceLevel === 'low' || currentSkin.bgEffect !== 'grid') return;
  ctx.save();
  ctx.strokeStyle = currentSkin.bgEffectColor;
  ctx.globalAlpha = 0.1 + Math.sin(visualTime) * 0.02;
  ctx.lineWidth = 1;
  const offset = (visualTime * 20) % 60;
  ctx.beginPath();
  for (let x = offset; x <= W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = offset; y <= H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.restore();
}
function drawBgParticles() {
  if (!effectsEnabled || performanceLevel === 'low') return;
  if (currentSkin.bgEffect === 'grid') { drawGridEffect(); return; }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.fillStyle = currentSkin.bgEffectColor;
  for (const particle of bgParticles) {
    if (particle.y < 0 || particle.y > H) continue;
    const effect = currentSkin.bgEffect;
    if (effect === 'stars') ctx.globalAlpha = 0.2 + 0.25 * (Math.sin(visualTime * 1.5 + particle.phase) + 1) / 2;
    else if (effect === 'fireflies') ctx.globalAlpha = Math.min(0.45, 0.25 + 0.25 * (Math.sin(visualTime * 2 + particle.phase) + 1) / 2);
    else ctx.globalAlpha = effect === 'petals' ? 0.35 : 0.4;
    if (effect === 'petals') {
      ctx.save(); ctx.translate(particle.x, particle.y); ctx.rotate(visualTime + particle.phase);
      ctx.fillRect(-2, -2, 4, 4); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}
function evaluatePerformance(dt) {
  if (!Number.isFinite(dt) || dt <= 0) return;
  avgFrameTime = avgFrameTime * 0.95 + dt * 0.05;
  performanceCheckTime += dt;
  recoveryTime = avgFrameTime < 1 / 55 ? recoveryTime + dt : 0;
  if (performanceCheckTime < 2) return;
  performanceCheckTime %= 2;
  const levels = ['low', 'medium', 'high'];
  let index = levels.indexOf(performanceLevel);
  const previous = index;
  if (avgFrameTime > 1 / 40) index = Math.max(0, index - 1);
  else if (recoveryTime >= 4) { index = Math.min(2, index + 1); recoveryTime = 0; }
  if (index !== previous) {
    performanceLevel = levels[index];
    if (performanceLevel === 'low') shockwaves = [];
    initBgParticles();
  }
}
function updateVisualEffects(dt, frameTime = dt) {
  visualTime += dt;
  evaluatePerformance(frameTime);
  if (!effectsEnabled) { shockwaves = []; bgParticles = []; bgSpawnTime = 0; return; }
  updateShockwaves(dt);
  updateBgParticles(dt);
}

function drawBackground() {
  const skin = getCurrentSkin();
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, skin.bgTop);
  gradient.addColorStop(1, skin.bgBottom);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}
function roundedCard(x, y, width, height, radius = 16) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + width, y, x + width, y + height, radius);
  ctx.arcTo(x + width, y + height, x, y + height, radius);
  ctx.arcTo(x, y + height, x, y, radius);
  ctx.arcTo(x, y, x + width, y, radius);
  ctx.closePath();
}
function drawMenuCard(lines) {
  const width = 340, padding = 30, gap = 14;
  const height = padding * 2 + lines.reduce((sum, line) => sum + line.size, 0) + gap * (lines.length - 1);
  const y = (H - height) / 2;
  ctx.save();
  roundedCard((W - width) / 2, y, width, height);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let textY = y + padding;
  for (const line of lines) {
    ctx.font = (line.bold ? 'bold ' : '') + line.size + 'px ' + UI_FONT;
    ctx.fillStyle = line.color || currentSkin.textColor;
    ctx.globalAlpha = line.alpha ?? 1;
    ctx.fillText(line.text, W / 2, textY + line.size / 2);
    textY += line.size + gap;
  }
  ctx.restore();
}
function drawReadyCard() {
  drawMenuCard([
    { text: '重力翻转小人', size: 24, bold: true },
    { text: '点击或按空格开始', size: 14, color: currentSkin.accentColor },
    { text: '成就: ' + unlockedAchievements.length + ' / ' + ACHIEVEMENTS.length, size: 12, alpha: 0.65 }
  ]);
}
function drawGameOverCard() {
  const lines = [
    { text: '游戏结束', size: 22, bold: true },
    { text: '分数: ' + score, size: 16, color: currentSkin.accentColor },
    { text: '最高: ' + best, size: 14 },
    { text: '最高连击: ' + maxCombo, size: 14 }
  ];
  if (deathCause === 'spike') lines.push({ text: '被尖刺刺中', size: 12, color: '#ef4444' });
  lines.push(
    { text: '点击或按空格重开', size: 14, color: currentSkin.accentColor },
    { text: '成就: ' + unlockedAchievements.length + ' / ' + ACHIEVEMENTS.length, size: 12, alpha: 0.65 }
  );
  drawMenuCard(lines);
}
function draw() {
  const skin = getCurrentSkin();
  drawBackground();
  drawBgParticles();
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(0, 0, W, 2);
  ctx.fillRect(0, H - 2, W, 2);
  for (const platform of platforms) {
    ctx.fillStyle = platform.moving ? skin.movingPlatformFill : skin.platformFill;
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    ctx.strokeStyle = skin.platformStroke;
    ctx.lineWidth = 2;
    ctx.strokeRect(platform.x + 1, platform.y + 1, platform.w - 2, platform.h - 2);
    drawSpikes(platform);
  }
  for (const coin of coins) drawCoinEffects(coin);
  drawPlayerGlow();
  drawPlayer();
  drawShockwaves();
  drawParticles();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillStyle = skin.accentColor;
  ctx.font = 'bold 18px ' + UI_FONT;
  // 为右上方 DOM 按钮组留出一行空间。
  const hudTop = getHudTop();
  ctx.fillText('分数: ' + score, 20, hudTop);
  if (combo >= 2) {
    const pulse = 1 + (Math.sin(gameTime * 6) + 1) * 0.03;
    ctx.save();
    ctx.translate(20, hudTop + 26);
    ctx.scale(pulse, pulse);
    ctx.font = '14px ' + UI_FONT;
    ctx.fillText('连击 x' + combo, 0, 0);
    ctx.restore();
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = skin.textColor;
  ctx.font = '14px ' + UI_FONT;
  ctx.fillText('最高: ' + best, W - 20, hudTop);
  ctx.fillText('金币: ' + wallet, W - 20, hudTop + 24);
  if (state === READY) drawReadyCard();
  else if (state === GAME_OVER) drawGameOverCard();
}

// 所有 DOM 控件单独消费事件，避免触摸兼容事件触发画布操作。
for (const id of ['sound-toggle', 'achievement-toggle', 'skin-toggle', 'effects-toggle', 'achievement-panel', 'skin-panel']) {
  const element = document.getElementById(id);
  for (const eventName of ['mousedown', 'touchstart']) {
    element.addEventListener(eventName, event => event.stopPropagation());
  }
}
document.getElementById('effects-toggle').addEventListener('click', event => {
  event.stopPropagation();
  toggleEffects();
});
document.getElementById('sound-toggle').addEventListener('click', event => {
  event.stopPropagation();
  toggleSound();
});
document.getElementById('achievement-toggle').addEventListener('click', event => {
  event.stopPropagation();
  initAudio();
  toggleAchievementPanel();
});
document.getElementById('skin-toggle').addEventListener('click', event => {
  event.stopPropagation();
  initAudio();
  toggleSkinPanel();
});
document.getElementById('achievement-panel').addEventListener('click', event => {
  event.stopPropagation();
  if (achievementPanelOpen) setPanel(null);
});
document.getElementById('skin-panel').addEventListener('click', event => {
  event.stopPropagation();
  if (event.target === event.currentTarget || event.target.closest('#close-skins')) setPanel(null);
});
window.addEventListener('keydown', event => {
  if (event.code === 'KeyT' || event.key.toLowerCase() === 't') {
    event.preventDefault();
    if (!event.repeat) toggleEffects();
    return;
  }
  if (event.code === 'KeyM' || event.key.toLowerCase() === 'm') {
    event.preventDefault();
    if (!event.repeat) toggleSound();
    return;
  }
  if (event.code === 'KeyA' || event.code === 'KeyS' || ['a', 's'].includes(event.key.toLowerCase())) {
    event.preventDefault();
    initAudio();
    if (!event.repeat) {
      if (event.code === 'KeyA' || event.key.toLowerCase() === 'a') toggleAchievementPanel();
      else toggleSkinPanel();
    }
    return;
  }
  if (isPausedByPanel) {
    if (event.key === 'Escape') { event.preventDefault(); setPanel(null); }
    else if (event.key === 'Tab') {
      const panel = document.getElementById(skinPanelOpen ? 'skin-panel' : 'achievement-panel');
      const buttons = [...panel.querySelectorAll('button')];
      const index = buttons.indexOf(document.activeElement);
      event.preventDefault();
      const next = event.shiftKey ? (index <= 0 ? buttons.length - 1 : index - 1) : (index + 1) % buttons.length;
      if (buttons[next]) buttons[next].focus();
    } else if (event.code === 'Space' || event.key === ' ') {
      event.preventDefault();
      if (!event.repeat && event.target && event.target.tagName === 'BUTTON') event.target.click();
    }
    return;
  }
  if (event.code !== 'Space' && event.key !== ' ') return;
  event.preventDefault();
  if (event.target && event.target.tagName === 'BUTTON') {
    if (!event.repeat) event.target.click();
    return;
  }
  if (!event.repeat) handleFlip();
});
canvas.addEventListener('mousedown', event => {
  if (event.button !== 0 || performance.now() - lastTouchTime < 800) return;
  event.preventDefault();
  canvas.focus({ preventScroll: true });
  handleFlip();
});
canvas.addEventListener('touchstart', event => {
  event.preventDefault();
  lastTouchTime = performance.now();
  if (event.touches.length === 1) {
    canvas.focus({ preventScroll: true });
    handleFlip();
  }
}, { passive: false });
window.addEventListener('touchmove', event => {
  if (isPausedByPanel && event.target.closest('.game-panel')) return;
  event.preventDefault();
}, { passive: false });
document.addEventListener('visibilitychange', () => { lastTime = null; });

function loop(now) {
  const frameTime = lastTime === null ? 0 : Math.max(0, (now - lastTime) / 1000);
  const dt = Math.min(frameTime, MAX_DT);
  lastTime = now;
  update(dt);
  updateVisualEffects(dt, frameTime);
  draw();
  requestAnimationFrame(loop);
}
resetGame();
state = READY;
initBgParticles();
renderEffectsButton();
requestAnimationFrame(loop);
</script>
</body>
</html>
